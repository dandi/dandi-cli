# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.0.1
    hooks:
    # CHANGELOG.md is generated by `auto` from pull request descriptions
    -   id: trailing-whitespace
        exclude: ^CHANGELOG\.md$
    -   id: end-of-file-fixer
        exclude: ^CHANGELOG\.md$
    -   id: check-yaml
    -   id: check-added-large-files
-   repo: https://github.com/psf/black
    rev: 22.12.0  # 22.3.0 crashes on Python 3.14, which pre-commit.ci uses
    hooks:
    -   id: black
        exclude: ^(dandi/_version\.py|dandi/due\.py|versioneer\.py)$
-   repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
    -   id: isort
        exclude: ^(dandi/_version\.py|dandi/due\.py|versioneer\.py)$
-   repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
    -   id: codespell
        exclude: ^(CHANGELOG\.md|dandi/_version\.py|dandi/due\.py|versioneer\.py|pyproject\.toml|dandi/data/allen_ccf_structures\.json)$
        additional_dependencies:
        - tomli; python_version<'3.11'
-   repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        exclude: ^(dandi/_version\.py|dandi/due\.py|versioneer\.py)$
-   repo: https://github.com/fsfe/reuse-tool
    rev: v5.0.2
    hooks:
    -   id: reuse
-   repo: https://github.com/kucherenko/jscpd
    rev: v5.4.3  # a new version may fingerprint clones differently: also
                 # update .jscpd-baseline.json (see DEVELOPMENT.md)
    hooks:
    # Scan all of dandi/ and tools/, not just the staged files, and fail over
    # the threshold in .jscpd.json or on a clone that .jscpd-baseline.json
    # lacks.  These args replace the hook's default `--exit-code 1`, which
    # fails on any clone at all.
    -   id: jscpd
        name: Check for duplicated code (to accept it, see DEVELOPMENT.md)
        args: [dandi, tools, --baseline, .jscpd-baseline.json, --fail-on-new-clones]
        pass_filenames: false
    # Accept the current clones: rewrite .jscpd-baseline.json
    -   id: jscpd
        alias: jscpd-update-baseline
        name: Accept duplicated code into .jscpd-baseline.json
        args: [dandi, tools, --baseline, .jscpd-baseline.json, --update-baseline]
        pass_filenames: false
        stages: [manual]
