# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.0.1
    hooks:
    # CHANGELOG.md is generated by `auto` from pull request descriptions
    -   id: trailing-whitespace
        exclude: ^CHANGELOG\.md$
    -   id: end-of-file-fixer
        exclude: ^CHANGELOG\.md$
    -   id: check-yaml
    -   id: check-added-large-files
-   repo: https://github.com/psf/black
    # On Python 3.14 (which pre-commit.ci uses), black 22.3.0 crashes on more
    # than one file, and 22.12.0, the newest release with the same style,
    # crashes in its AST safety check whenever it reformats a file.  --fast
    # skips that check; drop it when moving to black >= 23 (a new style).
    rev: 22.12.0
    hooks:
    -   id: black
        args: [--fast]
        exclude: ^(dandi/_version\.py|dandi/due\.py|versioneer\.py)$
-   repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
    -   id: isort
        exclude: ^(dandi/_version\.py|dandi/due\.py|versioneer\.py)$
-   repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
    -   id: codespell
        exclude: ^(CHANGELOG\.md|dandi/_version\.py|dandi/due\.py|versioneer\.py|pyproject\.toml|dandi/data/allen_ccf_structures\.json)$
        additional_dependencies:
        - tomli; python_version<'3.11'
-   repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        exclude: ^(dandi/_version\.py|dandi/due\.py|versioneer\.py)$
-   repo: https://github.com/fsfe/reuse-tool
    rev: v5.0.2
    hooks:
    -   id: reuse
